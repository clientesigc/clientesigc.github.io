  <script>
    (function () {
      function checkOrientation() {
        var notice = document.getElementById('rotate-screen-notice');
        if (!notice) return;

        // Proteção total para PC / Desktop (Windows, Mac, Linux):
        // NUNCA exibe o aviso de rotação em computadores, mesmo se a janela for redimensionada ou minimizada
        var isDesktop = /Windows NT|Macintosh|X11|CrOS/i.test(navigator.userAgent) && 
                        !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

        if (isDesktop) {
          notice.style.display = 'none';
          return;
        }

        // Dispositivos móveis reais (smartphones e tablets)
        var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        var isPortrait = window.innerHeight > window.innerWidth;

        if (isMobile && isPortrait) {
          notice.style.display = 'flex';
        } else {
          notice.style.display = 'none';
        }
      }

      checkOrientation();
      window.addEventListener('load', checkOrientation);
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', function () {
        setTimeout(checkOrientation, 150);
      });
    })();

    // Suporte a Tela Cheia Real no PC (remove as abas do Chrome e a barra de tarefas do Windows)
    (function () {
      function toggleFullScreen() {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(function () {});
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(function () {});
          }
        }
      }

      // 1. Atalho de duplo clique com o mouse em qualquer parte do vídeo/tela no PC
      document.addEventListener('dblclick', function (e) {
        // Ignora clique duplo se for em campos de texto/input
        if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
        toggleFullScreen();
      });

      // 2. Atalho da tecla 'F' (padrão YouTube/Netflix) para entrar/sair de tela cheia
      document.addEventListener('keydown', function (e) {
        if ((e.key === 'f' || e.key === 'F') && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
          e.preventDefault();
          toggleFullScreen();
        }
      });

      // 3. Sincronização automática quando o player expande o vídeo
      var fsObserver = new MutationObserver(function () {
        var isPlayerFs = !!document.querySelector('.de-fs-inapp');
        if (isPlayerFs && !document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(function () {});
          }
        } else if (!isPlayerFs && document.fullscreenElement) {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(function () {});
          }
        }
      });

      function initObserver() {
        var root = document.getElementById('root');
        if (root) {
          fsObserver.observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
        }
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initObserver);
      } else {
        initObserver();
      }
    })();
  </script>
